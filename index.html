      '<p style="font-size:13px;color:var(--muted-foreground,#6a7079);margin:0 0 14px">客户可以填写自己的兼容 OpenAI 接口信息，配置只保存在当前浏览器。提交比赛时请勿把真实 API Key 写进作品文件。</p>' +
      '<label style="display:block;font-size:13px;margin:10px 0 5px">API 地址</label><input id="freeAiBase" type="url" placeholder="https://api.openai.com/v1" style="width:100%;padding:9px 11px;border:1px solid var(--border-strong,#d8dbe2);border-radius:10px;background:transparent" />' +
      '<label style="display:block;font-size:13px;margin:10px 0 5px">API Key</label><input id="freeAiKey" type="password" autocomplete="off" placeholder="sk-..." style="width:100%;padding:9px 11px;border:1px solid var(--border-strong,#d8dbe2);border-radius:10px;background:transparent" />' +

      panel.querySelector("#freeAiBase").value = c.baseUrl || BASE;

        }).catch(function (err) {
          if (idx >= tried.length - 1) throw err;
          idx++;

    };
  }

动选择内容并逐条授权、你点击「确认并发送」。发送的是本次回答所需的最少内容，不会发送你的整个资料库。`},{title:`第三方是谁、发送什么`,body:`第三方是你在「AI 设置 → AI 服务连接」里检测并保存的当前 AI 服务（例如 DeepSeek、通义千问（阿里云百炼）、火山引擎（豆包）、腾讯混元、OpenRouter、OpenAI 等，以你实际使用的为准）。发送的内容是你本次授权的最少文字内容；图片 / 视频仅在 AI 模型支持且你确认时才会发送。文件资料只发送其文字元数据（标题 / 备注 / 标签），不会发送文件本身。`},{title:`朗读（文字转语音）`,body:`朗读：你点击 AI 回复旁的朗读按钮后，由设备/浏览器内置的文字转语音播放，不调用任何 AI 语音接口、不额外消耗 AI 额度、不保存音频；再次点击即停止。`},{title:`第三方是否保存、保存多久、是否境外`,body:`是否保存、保存多久、数据是否出境，取决于该 AI 服务的所在地及其官方条款与隐私政策。若所选 AI 服务位于境外，发送内容可能涉及跨境传输；是否继续由你自行判断。本应用不承诺任何第三方「绝对不保存数据」。`},{title:`如何删除、更正数据`,body:`你可以在资料列表编辑或删除内容；在「回收站」恢复或永久删除；在「AI 设置」清除已保存的 AI 配置。已发送给第三方 AI 服务的内容，请按该服务的官方方式申请删除或更正，本应用无法代为操作。`},{title:`如何撤回同意`,body:`你可以随时不授权、不发送，或清除 AI 配置。单条临时授权约 15 分钟自动失效，发送完成后立即撤销；下一次发送前必须重新授权。`},{title:`如何投诉 / 联系`,body:`本应用为本地优先的个人资料库应用，不设电话客服。如有隐私问题，请通过「设置 → 帮助与服务」填写问题描述后发送给我们。`},{title:`安全事件处理`,body:`本应用无服务器、不掌握你的账号与资料副本，因此不存在「我们这边泄露你的云端数据」这一情形；你的数据风险主要来自本机环境。若你怀疑本机浏览器数据被他人接触，请立即清除浏览器站点数据，并修改相关第三方服务的凭据。`},{title:`儿童隐私`,body:`本应用不面向儿童，不主动收集任何人的个人信息。未成年人请在监护人指导下使用。`},{title:`政策变更`,body:`本政策可能随功能调整而更新；重大变更会更新版本号与日期，请定期查看。`},{title:`安全边界（诚实说明）`,body:`本应用努力做好本地隔离与发送前授权，但不声称「绝对安全」，也不声称「已通过任何备案 / 认证 / 审核」。请勿在本应用中保存密码、Cookie、Token 等敏感凭据。`}],C_=[{title:`服务性质`,body:`本应用的功能可能随版本更新而调整、中断或终止。`},{title:`数据备份提示`,body:`请勿把唯一副本的重要资料只保存在本应用里，重要资料请自行定期备份到其他位置。你的资料默认只保存在当前设备的浏览器本地存储中，清除浏览器站点数据、卸载、更换浏览器或设备，都可能导致本机资料被删除且无法恢复；本应用不提供云端备份。`},{title:`用户自备 AI 服务与 API Key`,body:`AI 功能需要你使用自己的 API Key。本应用只把 Key 保存在你的本机浏览器里，不共用、不提供给任何第三方；额度、费用、封禁等风险由你自行承担。请遵守所选 AI 服务的官方使用条款。`},{title:`禁止事项`,body:`不得利用本应用从事违法活动；不得上传侵犯他人权利的内容；不得绕过所选服务商的条款批量滥用其 API；不得利用本应用保存或传输任何违反中华人民共和国法律法规的内容（包括但不限于含违法、侵权或他人隐私的文件）。`},{title:`内容责任`,body:`你对你保存、发送的内容（包括从本机添加的文件）承担全部法律责任。你从本机保存的文件只存储在本地浏览器，不会被自动上传；请勿保存或发送违法、侵权或可能危害他人权益的内容（如含他人隐私、涉密或受版权保护的文件）；因你保存或发送的内容引发的任何纠纷、处罚或损失，由你自行承担，本应用不代管、不备份、也不为你的内容承担责任。`},{title:`第三方服务与责任`,body:`AI 回答由第三方服务生成，可能不准确、不完整或过时。本应用不保证 AI 回答的正确性，也不承担因使用 AI 回答或第三方处理数据而产生的责任。`},{title:`知识产权`,body:`你保存的资料内容归你所有。本应用本身及其中开源组件的许可见「关于」页的「开源依赖与许可证」。`},{title:`服务变更与终止`,body:`本应用 <!-- ============================================================
     「脑子关机」外挂模块 v3
     加进「静海 AI」底部导航（AI 后面、设置前面），不动原应用任何代码。

     v3 改了什么（2026-09-25）：
     1. tab 从最后挪到「AI」后面、「设置」前面
     2. tab 改名「晚安」（原来叫「关机」，用户觉得不好）
     3. 打开页面有缓入动画（原来是 display 硬切，一点手感都没有）
     4. 去掉「1 / 4」那几个字
     5. 第 2 步改成自己填为主，预设词只是点一下帮你填的快捷键
     6. 第二天回来，列出昨晚写的每一件（带几点几分），逐件问做了没做
     7. 没做的可以选「带到今天」——不会自动堆着，也不会凭空消失，你自己决定
        （这个设计参考 MainQuest 的 End of Day Review：
          "Anything you don't re-commit stays behind instead of quietly re-appearing every day"）
     8. 按钮/卡片加了微交互（只动 transform 和 opacity，不掉帧）

      四步：写下来 → 定一件 → 收 → 躺下看词
      · 这些步骤是产品设计假设，不代表对所有人都有效。
      · 研究只能作为设计参考；正式发布前应补充完整论文引用、适用条件和自己的用户测试。
      · 本工具不是医疗或睡眠治疗工具，持续失眠或明显痛苦时应寻求专业帮助。

     硬规矩：全部本地跑，断网可用，不调任何模型，不填任何 Key。
     ============================================================ -->

<style>
/* ---------- 颜色 / 圆角：想换风格改这里 ---------- */
#fsPage{position:fixed;inset:0;z-index:2147483000;background:oklch(0.985 0.003 250);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;font-family:inherit}
/* 打开时的缓入：整体 + 内容逐条 */
#fsPage.on{display:block;animation:fsIn .34s cubic-bezier(.22,1,.36,1) both}
@keyframes fsIn{from{opacity:0}to{opacity:1}}
#fsPage.on .fs-wrap{animation:fsRise .42s cubic-bezier(.22,1,.36,1) both}
@keyframes fsRise{from{transform:translateY(16px) scale(.985)}to{transform:none}}
#fsPage.on #fsBody>*{animation:fsItemIn .4s cubic-bezier(.22,1,.36,1) both}
@keyframes fsItemIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#fsPage.on #fsBody>*:nth-child(1){animation-delay:.05s}
#fsPage.on #fsBody>*:nth-child(2){animation-delay:.09s}
#fsPage.on #fsBody>*:nth-child(3){animation-delay:.13s}
#fsPage.on #fsBody>*:nth-child(4){animation-delay:.17s}
#fsPage.on #fsBody>*:nth-child(5){animation-delay:.21s}
/* 切步骤：旧内容先缓出，新的再缓入，避免高度突变造成的跳动 */
#fsBody{transition:opacity .14s ease}
#fsBody.out{opacity:0}
/* 小鱼背景：原应用那个 canvas 会被临时搬到这里 */
#fsBg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}

.fs-wrap{max-width:480px;margin:0 auto;min-height:100%;padding:0 20px 40px;
  display:flex;flex-direction:column;position:relative;z-index:1}
.fs-bar{position:sticky;top:0;background:oklch(0.985 0.003 250);padding:14px 0 10px;
  display:flex;align-items:center;gap:10px;z-index:2}
.fs-x{width:34px;height:34px;border-radius:50%;border:1px solid rgba(38,40,43,.16);
  background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  transition:transform .16s cubic-bezier(.22,1,.36,1),background .2s}
.fs-x:hover{transform:scale(1.06)}
.fs-x:active{transform:scale(.92)}
.fs-x svg{width:16px;height:16px;stroke:#1a1c1f;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.fs-guide{font-size:12px;color:#6A7079;background:rgba(91,87,216,.07);
  border-radius:12px;padding:10px 12px;margin-bottom:14px;line-height:1.65}
/* 让主按钮能被 margin-top:auto 推到屏幕底部 */
#fsBody{display:flex;flex-direction:column;flex:1}
.fs-h{font-size:22px;font-weight:600;color:#1a1c1f;margin:8px 0 8px;letter-spacing:-.01em;line-height:1.35}
.fs-sub{font-size:13px;color:#6A7079;line-height:1.75;margin-bottom:18px}
.fs-card{background:#fff;border:1px solid rgba(38,40,43,.16);border-radius:20px;
  padding:16px;margin-bottom:14px}
.fs-in{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(38,40,43,.16);
  font-size:15px;background:#fff;color:#1a1c1f;outline:none;box-sizing:border-box;
  transition:border-color .2s,box-shadow .2s}
.fs-in:focus{border-color:#5B57D8;box-shadow:0 0 0 3px rgba(91,87,216,.12)}
.fs-item{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:13px;
  background:oklch(0.985 0.003 250);margin-bottom:8px;font-size:14px;line-height:1.55;
  cursor:pointer;border:1.5px solid transparent;word-break:break-word;
  transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .2s,background .2s}
.fs-item:hover{transform:translateY(-1px)}
.fs-item:active{transform:scale(.985)}
.fs-item.sel{border-color:#5B57D8;background:#fff}
.fs-del{margin-left:auto;flex:none;color:#9aa0a6;font-size:16px;padding:0 2px;line-height:1}
/* 空状态示例 */
.fs-ex{font-size:13px;color:#9aa0a6;line-height:1.9;padding:12px 2px 4px}
.fs-ex i{display:block;font-style:normal;padding-left:14px;position:relative}
.fs-ex i:before{content:'';position:absolute;left:4px;top:11px;width:4px;height:4px;
  border-radius:50%;background:rgba(38,40,43,.22)}
.fs-ex b{display:block;font-weight:400;color:#6A7079;padding-top:10px;font-style:normal}
/* 按钮微交互：只动 transform / opacity，不掉帧 */
.fs-btn{width:100%;padding:14px;border-radius:16px;background:#5B57D8;color:#fff;
  font-size:15px;font-weight:500;border:none;cursor:pointer;font-family:inherit;
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .22s,opacity .2s}
.fs-btn:hover:not(:disabled){transform:translateY(-1.5px);box-shadow:0 6px 16px rgba(91,87,216,.24)}
.fs-btn:active:not(:disabled){transform:translateY(0) scale(.975);box-shadow:0 2px 6px rgba(91,87,216,.2)}
.fs-btn:disabled{opacity:.35;cursor:default}
.fs-btn.ghost{background:#fff;color:#1a1c1f;border:1px solid rgba(38,40,43,.16)}
.fs-btn.ghost:hover:not(:disabled){box-shadow:0 6px 16px rgba(0,0,0,.07)}
.fs-btn.ghost:active:not(:disabled){box-shadow:none}
.fs-row{display:flex;gap:10px;flex-wrap:wrap}
.fs-row>*+*{margin-left:10px}
.fs-chip{padding:9px 13px;border-radius:12px;border:1px solid rgba(38,40,43,.16);
  background:#fff;font-size:13px;cursor:pointer;color:#1a1c1f;
  transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .2s,background .2s,color .2s}
.fs-chip:hover{transform:translateY(-1px);border-color:rgba(91,87,216,.4)}
.fs-chip:active{transform:scale(.94)}
.fs-chip.on{border-color:#5B57D8;color:#5B57D8;background:rgba(91,87,216,.07)}
.fs-lab{font-size:12px;color:#6A7079;margin:16px 0 9px}
.fs-lab em{font-style:normal;color:#9aa0a6}
.fs-note{font-size:12px;color:#9aa0a6;line-height:1.7;margin-top:10px}
.fs-history{width:100%;padding:11px 14px;border-radius:14px;border:1px solid rgba(38,40,43,.16);background:#fff;color:#1a1c1f;font-size:14px;cursor:pointer}
.fs-history-card{border:1px solid rgba(38,40,43,.16);border-radius:16px;padding:13px 14px;margin-bottom:10px;background:#fff}
.fs-history-date{font-size:12px;color:#6A7079;margin-bottom:8px}
.fs-history-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid rgba(38,40,43,.08);font-size:14px;line-height:1.5}
.fs-history-state{flex:none;font-size:12px;color:#6A7079}
.fs-history-item button{margin-left:auto;flex:none;padding:4px 8px;border:1px solid rgba(38,40,43,.16);border-radius:8px;background:#fff;font-size:11px;cursor:pointer}
.fs-history-actions{display:flex;gap:8px;margin-top:10px}
.fs-history-actions button{flex:1;padding:8px;border-radius:10px;border:1px solid rgba(38,40,43,.16);background:#fff;font-size:12px;cursor:pointer}
.fs-history-edit{display:flex;gap:8px;margin-top:10px}
.fs-history-edit input{flex:1;min-width:0;padding:9px 10px;border:1px solid rgba(38,40,43,.16);border-radius:10px;font-size:13px;background:#fff;color:#1a1c1f}
.fs-quote{background:rgba(91,87,216,.07);border-radius:16px;padding:16px;
  font-size:15px;line-height:1.8;color:#1a1c1f}
.fs-quote b{color:#5B57D8;font-weight:600}
.fs-dot{position:absolute;top:2px;right:12px;width:7px;height:7px;border-radius:50%;
  background:#E24B4A;display:none}
.fs-dot.on{display:block}
.fs-sp{margin-top:auto;padding-top:14px}
/* ---------- 第二天回来：逐件问 ---------- */
.fs-time{font-size:12px;color:#9aa0a6;margin-bottom:10px}
.fs-li{border:1px solid rgba(38,40,43,.16);border-radius:16px;padding:13px 14px;margin-bottom:10px;
  background:#fff}
.fs-li-t{font-size:14px;line-height:1.55;color:#1a1c1f;word-break:break-word}
.fs-li-ts{font-size:11px;color:#9aa0a6;margin-bottom:6px}
.fs-li-btns{display:flex;gap:7px;margin-top:11px}
.fs-mini{flex:1;padding:8px 0;border-radius:11px;border:1px solid rgba(38,40,43,.16);
  background:#fff;font-size:13px;color:#1a1c1f;cursor:pointer;font-family:inherit;
  transition:transform .16s cubic-bezier(.22,1,.36,1),background .2s,color .2s,border-color .2s}
.fs-mini:hover{transform:translateY(-1px)}
.fs-mini:active{transform:scale(.95)}
.fs-mini.done{background:#1D9E75;border-color:#1D9E75;color:#fff}
.fs-mini.no{background:#fff;color:#9aa0a6}
.fs-mini.carry{background:rgba(91,87,216,.1);border-color:rgba(91,87,216,.4);color:#5B57D8}
.fs-mini.think{background:rgba(196,128,32,.12);border-color:rgba(196,128,32,.4);color:#9a6418}
.fs-sum{font-size:14px;line-height:1.8;color:#1a1c1f;text-align:center;padding:6px 0}
.fs-plan{border:2px solid #5B57D8;border-radius:18px;padding:15px 16px;margin-bottom:14px;background:rgba(91,87,216,.07)}
.fs-plan-lab{font-size:12px;color:#5B57D8;font-weight:600;margin-bottom:6px}
.fs-plan-t{font-size:16px;line-height:1.55;color:#1a1c1f;font-weight:600}
.fs-carry-tag{font-size:11px;color:#5B57D8;background:rgba(91,87,216,.1);
  border-radius:6px;padding:2px 6px;margin-left:6px;white-space:nowrap;flex:none}
/* ---------- 第 4 步：躺下看词 ---------- */
.fs-sh{background:#fff;border:1px solid rgba(38,40,43,.16);border-radius:20px;
  padding:34px 20px 24px;text-align:center;margin-bottom:14px}
.fs-sh-no{font-size:12px;color:#9aa0a6;margin-bottom:16px}
.fs-sh-word{font-size:32px;font-weight:600;color:#1a1c1f;line-height:1.35;letter-spacing:.02em}
.fs-sh-word.in{animation:fsFade .55s cubic-bezier(.22,1,.36,1) both}
@keyframes fsFade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fs-sh-tip{font-size:13px;color:#6A7079;margin-top:16px;line-height:1.7}
.fs-prog{height:3px;border-radius:2px;background:rgba(38,40,43,.09);margin-top:22px;overflow:hidden}
.fs-prog i{display:block;height:100%;width:0;background:#5B57D8;border-radius:2px}

<div id="fsPage" role="dialog" aria-modal="true" aria-label="放下待办" aria-hidden="true">
  <div id="fsBg"></div>
  <div class="fs-wrap">
    <div class="fs-bar">
        <button class="fs-x" id="fsClose" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
    </div>
    <div class="fs-guide" id="fsGuide"></div>
    <div id="fsBody" tabindex="-1"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 【可改文字】界面上的话全在这里，改这里就行，别去下面翻代码
   * ============================================================ */
  var TXT = {
    tab: '放下',
    guide: '脑子停不下来的时候，来这儿把事倒出来',

    h1: '脑子里现在有什么',
    s1: '想做没做的、惦着的、一直放不下的，一条一条写下来。想写几条写几条。写下来就不用一直记着了。',
    ex1: '明天要交的作业',
    ex2: '还没回的消息',
    ex3: '一直惦着、又说不清的那件事',
    ex4: '想做但一直没动手的事',
    exNote: '不用写得整齐。碎片、半句话、重复的，都可以。',
    ph: '比如：英语 Unit 5 单词背完',
    add: '加一条',
     more: '可以继续写，也可以随时停下。没有固定条数要求。',
    carryTag: '上次带过来的',

    h2: '挑一件，定死它',
    s2: '从上面挑一件当第一件，把「什么时候、在哪」定死。',
    when: '什么时候',
    whenTip: '（自己填，下面的词点一下也能用）',
    where: '在哪',
    whereTip: '（可不填）',

    h3: '好了，先到这儿',
    done: '已经记下了。剩下的，不用再想了。',
    sleep: '好了',

    shTitle: '让脑子安静一会儿',
    shSub: '别想那些事了。就看着屏幕上的词，在脑子里看见它。',
    shTip: '看见它就行，别造句',
    shFoot: '想不出来也没关系，等下一个就行',
    shStop: '好了，走了',

     hBack: '上次写的，做了吗',
     history: '查看以前的计划',
     historyTitle: '以前的计划',
     historyEmpty: '还没有历史记录。写下第一件事后，就能在这里回看。',
     historyBack: '返回记录',
     edit: '改一下',
     remove: '删除这次记录',
     saveEdit: '保存修改',
     cancelEdit: '取消',
     editItem: '改',
     doneTitle: '这次回顾完成了',
     doneBody: '做过的事和还没做的事已经分开记下。以后可以在“以前的计划”里查看。',
     sBack: '先处理今天的计划，再处理其他记录。每件事只要选一个结果。',
    did: '做了',
    notyet: '没做',
     carry: '带到今天',
     rethink: '再想想',
    backDone: '都点完了',
    sumDone: '这一晚写了 {n} 件，做了 {d} 件，{c} 件带到今天。',
    sumPlain: '这一晚写了 {n} 件，做了 {d} 件。',
    goOn: '好了',
     remindAsk: '明天打开静海 AI 时，要我把昨晚写的显示出来吗？',
     remindYes: '好，下次打开显示',
    remindNo: '不用'
  };

  /* 快捷词：点一下帮你填进框里，不是只能选它 */
  var WHENS = ['起床后', '早饭后', '到教室后', '午饭后', '晚饭后'];
  var WHERES = ['书桌前', '教室里', '床上', '地铁上'];

  /* 【可改内容】第 4 步的词。要求：具体、看得见、不带情绪。 */
  var WORDS = [
    '晾衣绳', '切开的柠檬', '生锈的铁门', '一把旧钥匙', '空的鸟窝',
    '冰面上的裂纹', '晒热的石头', '半杯水', '旧木椅', '红色消防栓',
    '撕开的信封', '窗台上的猫', '靠墙的自行车', '半开的抽屉', '玻璃上的雨滴',
    '空纸箱', '路灯', '剥落的墙皮', '竹篮子', '滴水的水龙头',
    '倒扣的碗', '老式电话', '木栅栏', '干枯的树叶', '玻璃弹珠',
    '毛线团', '旧皮箱', '石阶', '铁皮盒', '断掉的铅笔',
    '搪瓷缸', '蒲扇', '屋檐', '井盖', '铜锁',
    '布鞋', '藤椅', '陶罐', '麻绳', '木头小船',
    '贝壳', '松果', '鹅卵石', '棉花', '羽毛',
    '蜡烛', '撑开的雨伞', '纽扣', '木梳', '圆镜子',
    '玻璃瓶', '草帽', '风铃', '石磨', '竹筛',
    '船桨', '搪瓷脸盆', '木门槛', '铜铃', '竹席'
  ];
  var SH_SEC = 8;  /* 【可改】每个词停几秒 */

  /* ============================================================
   * 数据：全部存在这台设备上，不上传任何东西
   * ============================================================ */
  var LS_LOG = 'fs.log.v1';
  var LS_CFG = 'fs.cfg.v1';
  var LS_CARRY = 'fs.carry.v1';

  function read(k, d) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }
    catch (e) { return d; }
  }
  function write(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { return false; }
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  /* 早上 6 点算分界：6 点前写的还属于「昨晚」 */
  function morning6() {
    var d = new Date(); d.setHours(6, 0, 0, 0); return d.getTime();
  }
  function hhmm(ts) {
    var d = new Date(ts);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function cfg() { return read(LS_CFG, { remind: 0, asked: 0 }); }
  function saveCfg(c) { write(LS_CFG, c); }
  function log() { return read(LS_LOG, []); }

  /* 所有还没处理的记录（可能有好几条：昨晚、前晚…） */
  function pendings() {
    var a = log(), out = [];
    a.forEach(function (r) {
      if (r && !r.handled && r.createdAt < morning6()) out.push(r);
    });
    return out;
  }
  function hasPending() { return pendings().length > 0; }

  /* ============================================================
   * 页面
   * ============================================================ */
  var page = document.getElementById('fsPage');
  var body = document.getElementById('fsBody');
  var guide = document.getElementById('fsGuide');
  var cur = [];       /* 当前写的条目 [{t, ts, from}] */
  var pick = -1;
  var whenV = '', whereV = '';
  var shT = null;
  var lastFocus = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function $(id) { return document.getElementById(id); }

  function stopSh() { if (shT) { clearTimeout(shT); shT = null; } }
  function showGuide(on) { guide.style.display = on ? '' : 'none'; }
  /* 步骤号已经去掉了，函数留成空的，调用处不用改 */
  function setStep() {}

  /* 切步骤：旧的先缓出，换完再缓入，顺便把滚动条拉回顶部。
     不做这一步的话，内容高度一变，页面就会跳一下。 */
  var swapT = null;
  function swap(fill) {
    if (swapT) { clearTimeout(swapT); swapT = null; }
    body.classList.add('out');
    swapT = setTimeout(function () {
      swapT = null;
      fill();
      page.scrollTop = 0;
      body.classList.remove('out');
    }, 140);
  }

  /* ============================================================
   * 小鱼背景：把静海 AI 自己的那块 canvas 临时搬进来当背景
   * 搬的是同一个元素，所以鱼还在游；关掉页面会放回原处
   * ============================================================ */
  var FISH = null, FISH_HOME = null;
  function fishBox() {
    var c = document.querySelector('canvas');
    return c ? c.parentElement : null;
  }
  function mountFish() {
    try {
      if (!FISH) {
        var box = fishBox();
        if (!box) return;
        FISH = box;
        FISH_HOME = { p: box.parentElement, n: box.nextSibling };
      }
      var bg = $('fsBg');
      if (bg && FISH.parentElement !== bg) {
        bg.appendChild(FISH);
        FISH.style.position = 'fixed';
        FISH.style.zIndex = '0';
      }
    } catch (e) {}
  }
  function unmountFish() {
    try {
      if (!FISH || !FISH_HOME || !FISH_HOME.p) return;
      if (FISH.parentElement !== FISH_HOME.p) {
        if (FISH_HOME.n && FISH_HOME.n.parentElement === FISH_HOME.p) {
          FISH_HOME.p.insertBefore(FISH, FISH_HOME.n);
        } else {
          FISH_HOME.p.appendChild(FISH);
        }
        FISH.style.position = '';
        FISH.style.zIndex = '';
      }
    } catch (e) {}
  }

  function open() {
    lastFocus = document.activeElement;
    page.classList.add('on');
    page.setAttribute('aria-hidden', 'false');
    mountFish();
    var ps = pendings();
    if (ps.length) renderBack(ps); else render1();
    setTimeout(function () { try { body.focus(); } catch (e) {} }, 0);
  }
  function close() {
    stopSh();
    page.classList.remove('on');
    page.setAttribute('aria-hidden', 'true');
    unmountFish();
    try { if (lastFocus && lastFocus.focus) lastFocus.focus(); } catch (e) {}
  }

  document.addEventListener('keydown', function (e) {
    if (!page.classList.contains('on')) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
  });

  /* ---------- 回来页：上次写的逐件问 ---------- */
  function renderBack(ps) { swap(function () { renderBackRaw(ps); }); }
  function renderBackRaw(ps) {
    stopSh(); showGuide(true); setStep('');
    body.innerHTML =
      '<div class="fs-h">' + esc(TXT.hBack) + '</div>' +
      '<div class="fs-sub">' + esc(TXT.sBack) + '</div>' +
      '<div id="fsPlan"></div>' +
      '<div id="fsBackList"></div>' +
      '<div class="fs-sp"><button class="fs-btn" id="fsGo" disabled>' + esc(TXT.goOn) + '</button></div>';

    function draw() {
      var h = '';
      var plan = null;
      for (var pi = ps.length - 1; pi >= 0; pi--) {
        if (ps[pi].picked) { plan = ps[pi]; break; }
      }
      $('fsPlan').innerHTML = plan ?
        '<div class="fs-plan"><div class="fs-plan-lab">今天的计划 · 做了吗？</div><div class="fs-plan-t">' + esc(plan.picked) + '</div>' +
        '<div class="fs-note">下面找到对应事项后，选择“做了”“没做”或“带到今天”。</div></div>' :
        '<div class="fs-guide">这里是你之前写下的事项。没有固定任务，逐条选择结果即可。</div>';
      ps.forEach(function (r) {
        var items = r.items || [];
        if (!items.length) return;
        h += '<div class="fs-card"><div class="fs-time">' + esc(hhmm(r.createdAt)) + ' 写的</div>';
        items.forEach(function (it, j) {
          var t = typeof it === 'string' ? it : it.t;
          var st = typeof it === 'string' ? null : it.st;
          var ts = (it && it.ts) ? ' · ' + hhmm(it.ts) : '';
          h += '<div class="fs-li"><div class="fs-li-ts">第 ' + (j + 1) + ' 条' + esc(ts) + '</div>' +
            '<div class="fs-li-t">' + esc(t) + '</div>' +
            '<div class="fs-li-btns">' +
            '<button class="fs-mini' + (st === 1 ? ' done' : '') + '" data-r="' + r.id + '" data-j="' + j + '" data-v="1">' + esc(TXT.did) + '</button>' +
            '<button class="fs-mini' + (st === 0 ? ' no' : '') + '" data-r="' + r.id + '" data-j="' + j + '" data-v="0">' + esc(TXT.notyet) + '</button>' +
             '<button class="fs-mini' + (st === 2 ? ' carry' : '') + '" data-r="' + r.id + '" data-j="' + j + '" data-v="2">' + esc(TXT.carry) + '</button>' +
             '<button class="fs-mini' + (st === 3 ? ' think' : '') + '" data-r="' + r.id + '" data-j="' + j + '" data-v="3">' + esc(TXT.rethink) + '</button>' +
            '</div></div>';
        });
        h += '</div>';
      });
      $('fsBackList').innerHTML = h;

      /* 统计：全用真实数据，不虚报 */
      var n = 0, d = 0, c = 0, left = 0;
      ps.forEach(function (r) {
        (r.items || []).forEach(function (it) {
          n++;
          var st = (it && typeof it === 'object') ? it.st : null;
          /* 0 = 没做，也算处理过了，不能当成没点 */
          if (st === 1) d++;
          else if (st === 2) c++;
          else if (st !== 0) left++;
        });
      });
      if (!left) {
        var s = c > 0 ? TXT.sumDone : TXT.sumPlain;
        s = s.replace('{n}', n).replace('{d}', d).replace('{c}', c);
        $('fsBackList').insertAdjacentHTML('beforeend',
          '<div class="fs-card"><div class="fs-sum">' + esc(s) + '</div></div>');
        var go = $('fsGo');
        go.disabled = false;
        go.onclick = function () {
          ps.forEach(function (r) {
            var a = log();
            for (var i = 0; i < a.length; i++) {
              if (a[i].id === r.id) { a[i].handled = 1; break; }
            }
            write(LS_LOG, a);
          });
          updot(); render1();
        };
      } else {
        $('fsGo').disabled = true;
      }

      $('fsBackList').querySelectorAll('.fs-mini').forEach(function (b) {
        b.onclick = function () {
          var rid = +b.getAttribute('data-r'), j = +b.getAttribute('data-j'), v = +b.getAttribute('data-v');
          var a = log(), target = null;
          for (var i = 0; i < a.length; i++) { if (a[i].id === rid) { target = a[i]; break; } }
          if (!target || !target.items[j]) return;
          if (typeof target.items[j] === 'string') {
            target.items[j] = { t: target.items[j], ts: target.createdAt, st: v };
          } else {
            target.items[j].st = v;
          }
          /* 带到今天：存进 carry，下次写的时候自动带出来 */
           if (v === 2) {
             var car = read(LS_CARRY, []);
             if (!car.some(function (x) { return x.t === target.items[j].t; })) car.push({ t: target.items[j].t });
             write(LS_CARRY, car);
           }
           if (v === 0 || v === 2) target.handled = 1;
          write(LS_LOG, a);
           ps = pendings();
           if (!ps.length) {
             updot();
             $('fsBackList').insertAdjacentHTML('beforeend', '<div class="fs-card"><div class="fs-sum"><b>' + esc(TXT.doneTitle) + '</b><br>' + esc(TXT.doneBody) + '</div></div>');
             $('fsGo').disabled = false;
             return;
           }
           draw();
        };
      });
    }
    draw();
  }

  /* ---------- 第 1 步：写下来 ---------- */
  function render1() { swap(render1Raw); }
  function render1Raw() {
    stopSh(); showGuide(true); setStep('');
    cur = []; pick = -1; whenV = ''; whereV = '';

    /* 昨天带过来的，自动填进来 */
    var car = read(LS_CARRY, []);
    if (car.length) {
      car.forEach(function (x) { cur.push({ t: x.t, ts: Date.now(), from: 1 }); });
      /* 只有成功完成并保存本次记录后才清掉带过来的内容。 */
    }

    body.innerHTML =
      '<div class="fs-h">' + esc(TXT.h1) + '</div>' +
      '<div class="fs-sub">' + esc(TXT.s1) + '</div>' +
      '<div class="fs-card"><div class="fs-row">' +
      '<input class="fs-in" id="fsIn" placeholder="' + esc(TXT.ph) + '" autocomplete="off">' +
      '</div><div class="fs-row" style="margin-top:10px">' +
      '<button class="fs-btn ghost" style="width:auto;padding:12px 18px" id="fsAdd">' + esc(TXT.add) + '</button>' +
      '</div><div id="fsList" style="margin-top:14px"></div>' +
      '<div class="fs-note" id="fsNote"></div></div>' +
      '<button class="fs-history" id="fsHistory" type="button">' + esc(TXT.history) + '</button>' +
      '<div class="fs-sp"><button class="fs-btn" id="fsNext" disabled>下一步</button></div>';

    var inp = $('fsIn'), list = $('fsList'), note = $('fsNote'), next = $('fsNext');

    function draw() {
      if (cur.length) {
        list.innerHTML = cur.map(function (x, i) {
          return '<div class="fs-item"><span>' + esc(x.t) + '</span>' +
            (x.from ? '<span class="fs-carry-tag">' + esc(TXT.carryTag) + '</span>' : '') +
            '<span class="fs-del" data-del="' + i + '">×</span></div>';
        }).join('');
        list.querySelectorAll('[data-del]').forEach(function (d) {
          d.onclick = function (e) {
            e.stopPropagation();
            cur.splice(+d.getAttribute('data-del'), 1);
            draw();
          };
        });
      } else {
        list.innerHTML =
          '<div class="fs-ex"><i>' + esc(TXT.ex1) + '</i><i>' + esc(TXT.ex2) + '</i>' +
          '<i>' + esc(TXT.ex3) + '</i><i>' + esc(TXT.ex4) + '</i>' +
          '<b>' + esc(TXT.exNote) + '</b></div>';
      }
      note.textContent = cur.length && cur.length < 10 ? TXT.more : '';
      next.disabled = cur.length === 0;
    }
    function add() {
      var v = (inp.value || '').trim();
      if (!v) return;
      cur.push({ t: v.slice(0, 60), ts: Date.now(), from: 0 });
      inp.value = ''; inp.focus(); draw();
    }
    $('fsAdd').onclick = add;
    $('fsHistory').onclick = renderHistory;
    inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } };
    next.onclick = function () { render2(); };
    draw();
    inp.focus();
  }

  function renderHistory() { swap(renderHistoryRaw); }
  function renderHistoryRaw() {
    stopSh(); showGuide(true); setStep('');
    var a = log().slice().reverse(), h = '';
    a.forEach(function (r) {
      if (!r || !r.items || !r.items.length) return;
      h += '<div class="fs-history-card"><div class="fs-history-date">' + esc(r.date || today()) + ' · ' + esc(hhmm(r.createdAt)) + '</div>';
      r.items.forEach(function (it) {
        var t = typeof it === 'string' ? it : it.t;
        var st = typeof it === 'object' ? it.st : null;
        var label = st === 1 ? '做了' : (st === 0 ? '没做' : (st === 2 ? '带到今天' : (st === 3 ? '再想想' : '未处理')));
        h += '<div class="fs-history-item"><span class="fs-history-state">' + esc(label) + '</span><span data-item-text>' + esc(t) + '</span><button type="button" data-edit-item="' + r.id + ':' + j + '">' + esc(TXT.editItem) + '</button></div>';
      });
      h += '<div class="fs-history-actions"><button type="button" data-edit="' + r.id + '">' + esc(TXT.edit) + '</button><button type="button" data-remove="' + r.id + '">' + esc(TXT.remove) + '</button></div></div>';
    });
    body.innerHTML = '<div class="fs-h">' + esc(TXT.historyTitle) + '</div>' +
      '<div class="fs-sub">你写过的计划都会留在这里，方便回看哪些完成了，哪些还没完成。</div>' +
      (h || '<div class="fs-guide">' + esc(TXT.historyEmpty) + '</div>') +
      '<div class="fs-sp"><button class="fs-btn ghost" id="fsHistoryBack">' + esc(TXT.historyBack) + '</button></div>';
    $('fsHistoryBack').onclick = render1;
    body.querySelectorAll('[data-remove]').forEach(function (b) {
      b.onclick = function () {
        var id = +b.getAttribute('data-remove');
        if (!window.confirm('确定删除这次计划记录吗？删除后无法恢复。')) return;
        var a = log().filter(function (r) { return r.id !== id; });
        if (write(LS_LOG, a)) renderHistory();
      };
    });
    body.querySelectorAll('[data-edit]').forEach(function (b) {
      b.onclick = function () {
        var id = +b.getAttribute('data-edit'), a = log(), r = null;
        for (var i = 0; i < a.length; i++) if (a[i].id === id) r = a[i];
        if (!r) return;
        var card = b.closest('.fs-history-card');
        if (!card || card.querySelector('[data-edit-input]')) return;
        var old = r.picked || (r.items[0] && r.items[0].t) || '';
        var box = document.createElement('div'); box.className = 'fs-history-edit';
        box.innerHTML = '<input data-edit-input maxlength="60" value="' + esc(old) + '"><button type="button" data-save-edit>' + esc(TXT.saveEdit) + '</button><button type="button" data-cancel-edit>' + esc(TXT.cancelEdit) + '</button>';
        card.appendChild(box);
        var input = box.querySelector('[data-edit-input]'); input.focus(); input.select();
        box.querySelector('[data-cancel-edit]').onclick = function () { box.remove(); };
        box.querySelector('[data-save-edit]').onclick = function () {
          var v = (input.value || '').trim();
          if (!v) { input.focus(); return; }
          r.picked = v.slice(0, 60);
          (r.items || []).forEach(function (it) {
            if (it && typeof it === 'object' && it.t === old) it.t = r.picked;
          });
          if (write(LS_LOG, a)) renderHistory();
        };
      };
    });
    body.querySelectorAll('[data-edit-item]').forEach(function (b) {
      b.onclick = function () {
        var p = b.getAttribute('data-edit-item').split(':'), id = +p[0], j = +p[1], a = log(), r = null;
        for (var i = 0; i < a.length; i++) if (a[i].id === id) r = a[i];
        if (!r || !r.items[j]) return;
        var row = b.parentElement, text = row.querySelector('[data-item-text]'), old = text.textContent;
        if (row.querySelector('input')) return;
        var input = document.createElement('input'); input.value = old; input.maxLength = 60; input.style.cssText = 'flex:1;min-width:0;padding:5px;border:1px solid #5B57D8;border-radius:8px';
        text.replaceWith(input); b.textContent = '保存';
        b.onclick = function () { var v = input.value.trim(); if (!v) return; r.items[j] = typeof r.items[j] === 'string' ? v : Object.assign({}, r.items[j], { t: v }); if (r.picked === old) r.picked = v; if (write(LS_LOG, a)) renderHistory(); };
      };
    });
  }

  /* ---------- 第 2 步：定死一件（自己填为主，预设词只是快捷键） ---------- */
  function render2() { swap(render2Raw); }
  function render2Raw() {
    stopSh(); showGuide(true); setStep('');
    body.innerHTML =
      '<div class="fs-h">' + esc(TXT.h2) + '</div>' +
      '<div class="fs-sub">' + esc(TXT.s2) + '</div>' +
      '<div class="fs-card"><div id="fsPick"></div>' +
      '<div class="fs-lab">' + esc(TXT.when) + ' <em>' + esc(TXT.whenTip) + '</em></div>' +
      '<input class="fs-in" id="fsWhen" placeholder="自己填，比如：明天早自习">' +
      '<div class="fs-row" id="fsW" style="margin-top:9px"></div>' +
      '<div class="fs-lab">' + esc(TXT.where) + ' <em>' + esc(TXT.whereTip) + '</em></div>' +
      '<input class="fs-in" id="fsWhere" placeholder="自己填，比如：靠窗那个座位">' +
      '<div class="fs-row" id="fsP" style="margin-top:9px"></div>' +
      '</div>' +
      '<div class="fs-sp"><button class="fs-btn" id="fsOk" disabled>好了</button></div>';

    var pk = $('fsPick'), W = $('fsW'), P = $('fsP'), ok = $('fsOk');
    var wi = $('fsWhen'), pi = $('fsWhere');

    function drawPick() {
      pk.innerHTML = cur.map(function (x, i) {
        return '<div class="fs-item' + (i === pick ? ' sel' : '') + '" data-p="' + i + '"><span>' + esc(x.t) + '</span></div>';
      }).join('');
      pk.querySelectorAll('[data-p]').forEach(function (d) {
        d.onclick = function () { pick = +d.getAttribute('data-p'); drawPick(); check(); };
      });
    }
    /* 预设词不再是选项，点一下帮你填进输入框 */
    function chips(box, arr, input) {
      box.innerHTML = arr.map(function (v) {
        return '<div class="fs-chip" data-v="' + esc(v) + '">' + esc(v) + '</div>';
      }).join('');
      box.querySelectorAll('[data-v]').forEach(function (c) {
        c.onclick = function () {
          input.value = c.getAttribute('data-v');
          check();
        };
      });
    }
    function check() {
      whenV = (wi.value || '').trim();
      whereV = (pi.value || '').trim();
      ok.disabled = !(pick >= 0 && whenV);
    }

    wi.oninput = check;
    pi.oninput = check;
    chips(W, WHENS, wi);
    chips(P, WHERES, pi);
    ok.onclick = function () { render3(); };
    drawPick(); check();
  }

  /* ---------- 第 3 步：收 ---------- */
  function render3() { swap(render3Raw); }
  function render3Raw() {
    stopSh(); showGuide(true); setStep('');
    var what = cur[pick] ? cur[pick].t : '';
    var w = (whenV || '明天') + (whereV ? '，在' + whereV : '');
    body.innerHTML =
      '<div class="fs-h">' + esc(TXT.h3) + '</div>' +
      '<div class="fs-card"><div class="fs-quote">如果 <b>' + esc(w) + '</b>，<br>我就 <b>' + esc(what) + '</b></div></div>' +
      '<div class="fs-card" style="background:rgba(91,87,216,.05);border-color:rgba(91,87,216,.2)">' +
      '<div style="font-size:14px;line-height:1.8;color:#1a1c1f">' + esc(TXT.done) + '</div></div>' +
      '<div class="fs-sp"><button class="fs-btn" id="fsSleep">' + esc(TXT.sleep) + '</button></div>';

    $('fsSleep').onclick = function () {
      var a = log();
      a.push({
        id: Date.now(), date: today(),
        items: cur.map(function (x) { return { t: x.t, ts: x.ts, st: null }; }),
        picked: what, when: whenV, where: whereV,
        done: null, handled: 0, createdAt: Date.now()
      });
      /* 限制历史记录，避免 localStorage 无限增长。 */
      if (a.length > 200) a = a.slice(-200);
      if (!write(LS_LOG, a)) {
        body.insertAdjacentHTML('afterbegin', '<div class="fs-guide" role="alert">本次内容没有保存成功，请先清理浏览器空间后重试。</div>');
        return;
      }
      write(LS_CARRY, []);
      updot();
      var c = cfg();
      if (!c.asked) { renderRemind(); } else { renderShuffle(); }
    };
  }

  /* 第一次用完立刻问要不要提醒——这个位置很关键，别往设置里塞 */
  function renderRemind() { swap(renderRemindRaw); }
  function renderRemindRaw() {
    stopSh(); showGuide(true); setStep('');
    body.innerHTML =
      '<div class="fs-h">' + esc(TXT.remindAsk) + '</div>' +
      '<div class="fs-sub">开了之后，第二天打开静海 AI 就能看到昨晚写的那些。</div>' +
      '<div class="fs-row"><button class="fs-btn" id="fsYes">' + esc(TXT.remindYes) + '</button>' +
      '<button class="fs-btn ghost" id="fsNo">' + esc(TXT.remindNo) + '</button></div>';
    $('fsYes').onclick = function () {
      saveCfg({ remind: 1, asked: 1 });
      renderShuffle();
    };
    $('fsNo').onclick = function () {
      saveCfg({ remind: 0, asked: 1 }); renderShuffle();
    };
  }

  /* ---------- 第 4 步：躺下看词（认知洗牌） ---------- */
  function renderShuffle() { swap(renderShuffleRaw); }
  function renderShuffleRaw() {
    stopSh();
    showGuide(false);
    setStep('');
    body.innerHTML =
      '<div class="fs-h">' + esc(TXT.shTitle) + '</div>' +
      '<div class="fs-sub">' + esc(TXT.shSub) + '</div>' +
      '<div class="fs-sh">' +
      '<div class="fs-sh-no" id="shNo"></div>' +
      '<div class="fs-sh-word" id="shWord"></div>' +
      '<div class="fs-sh-tip">' + esc(TXT.shTip) + '</div>' +
      '<div class="fs-prog"><i id="shBar"></i></div>' +
      '</div>' +
      '<div class="fs-note" style="text-align:center">' + esc(TXT.shFoot) + '</div>' +
      '<div class="fs-sp"><button class="fs-btn" id="shStop">' + esc(TXT.shStop) + '</button></div>';

    var n = 0;
    var idx = Math.floor(Math.random() * WORDS.length);

    function show() {
      var el = $('shWord');
      if (!el) return;
      el.textContent = WORDS[idx];
      el.classList.remove('in');
      void el.offsetWidth;
      el.classList.add('in');
      $('shNo').textContent = '第 ' + (n + 1) + ' 个词';
      var bar = $('shBar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      void bar.offsetWidth;
      bar.style.transition = 'width ' + SH_SEC + 's linear';
      bar.style.width = '100%';
      shT = setTimeout(next, SH_SEC * 1000);
    }
    function next() {
      n++;
      idx = (idx + 1 + Math.floor(Math.random() * 3)) % WORDS.length;
      show();
    }
    $('shStop').onclick = function () { close(); updot(); };
    show();
  }

  /* ============================================================
   * 深色模式：跟着静海 AI 的开关走
   * ============================================================ */
  function syncTheme() {
    page.classList.toggle('dark', document.documentElement.classList.contains('dark'));
  }
  syncTheme();
  try {
    new MutationObserver(syncTheme).observe(document.documentElement,
      { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}

  /* ============================================================
   * 导航入口：插到「设置」前面，样子复制静海 AI 自己的按钮
   * ============================================================ */
  var ICON = '<path d="M20.5 14.6A8.5 8.5 0 1 1 9.4 3.5a6.8 6.8 0 0 0 11.1 11.1Z"/>';

  function findTabs() {
    var all = document.querySelectorAll('nav button, [role="tablist"] button, header button, footer button');
    var out = [];
    Array.prototype.forEach.call(all, function (b) {
      var r = b.getBoundingClientRect();
      var label = (b.textContent || '').trim();
      var known = /^(首页|资料|添加|AI|设置)$/.test(label);
      if (r.width > 40 && r.height > 20 && (r.bottom > window.innerHeight - 180 || known)) out.push(b);
    });
    return out;
  }

  var injected = false;

  function injectTab() {
    if (injected || $('fsTab')) return true;
    var tabs = findTabs();
    /* 某些内嵌浏览器在首次布局时返回 0 尺寸，按导航文字兜底。 */
    if (tabs.length < 3) {
      var navs = document.querySelectorAll('nav');
      for (var ni = navs.length - 1; ni >= 0 && tabs.length < 3; ni--) {
        var bs = navs[ni].querySelectorAll('button');
        Array.prototype.forEach.call(bs, function (b) {
          if (/^(首页|资料|添加|AI|设置)$/.test((b.textContent || '').trim()) && tabs.indexOf(b) < 0) tabs.push(b);
        });
      }
    }
    if (tabs.length < 3) return false;
    var anchor = tabs[tabs.length - 1];
    var box = anchor.parentElement;

    /* 找「设置」那个按钮，插到它前面 */
    var before = null;
    Array.prototype.forEach.call(tabs, function (b) {
      if (/设置/.test(b.textContent || '')) before = b;
    });

    var tab = anchor.cloneNode(true);
    tab.removeAttribute('aria-current');
    tab.id = 'fsTab';
    var svg = tab.querySelector('svg');
    if (svg) {
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.innerHTML = ICON;
    }
    var spans = tab.querySelectorAll('span'), txt = null;
    Array.prototype.forEach.call(spans, function (s) {
      if (!s.children.length && s.textContent.trim()) txt = s;
    });
    if (txt) txt.textContent = TXT.tab;
    var dot = document.createElement('span');
    dot.className = 'fs-dot'; dot.id = 'fsDot';
    tab.appendChild(dot);
    tab.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      page.classList.contains('on') ? close() : open();
    }, true);

    if (before && before.parentElement === box) box.insertBefore(tab, before);
    else box.appendChild(tab);

    /* 六个按钮在小屏会挤出去，这里强制收一下 */
    box.style.maxWidth = 'calc(100vw - 18px)';
    Array.prototype.forEach.call(box.children, function (c) {
      c.style.flexShrink = '1'; c.style.minWidth = '0';
    });
    injected = true;
    updot();
    return true;
  }

  function updot() {
    var d = $('fsDot'); if (!d) return;
    d.classList.toggle('on', hasPending());
  }

  /* ============================================================
   * 启动
   * ============================================================ */
  $('fsClose').onclick = close;
  guide.textContent = TXT.guide;

  var tries = 0;
  var timer = setInterval(function () {
    if (injectTab() || ++tries > 40) clearInterval(timer);
  }, 300);

  window.addEventListener('resize', function () { updot(); });
  setInterval(updot, 300000);
})();
</script>

<!-- ============================================================
     「进展」模块 v2 —— 插在静海 AI 首页顶部（紧凑条，带动画）
     体积：原来一大块约 370px，现在压成一条约 86px，不挡视野
     颜色：全部用静海 AI 自己的 CSS 变量（--brand / --foreground / --border-strong 等），
           深浅色模式自动跟随，不硬编码颜色
     动画：进场淡入上移 / 柱子逐根长出 / 数字滚动 / 按钮按压反馈
     三件事：
       1 我走到哪了（进展原则 Amabile & Kramer 2011）
       2 今天的一小步（小胜利）
       3 你回来了 —— 隔很久才出现，绝不责备（挫折的打击是进展激励的 2-3 倍）
     不做的：连续打卡天数、排行榜、随机奖励、推送施压
     ============================================================ -->

<style>
#fpCard{
  margin:10px 0 2px;
  padding:12px 14px;
  border:1px solid var(--border-strong, rgba(38,40,43,.16));
  border-radius:var(--radius, 14px);
  background:#fff;
  color:var(--foreground, #1a1c1f);
  font-family:inherit;
  box-sizing:border-box;
  animation:fpIn .38s cubic-bezier(.22,1,.36,1) both;
  transition:background .3s ease, border-color .3s ease, color .3s ease;
}
/* 首页统计条不再占用主任务区域，历史记录统一从“放下”进入。 */
#fpCard{display:none!important}
/* 深色模式：html 的 class 会变成 dark，这里跟着换底色 */
#fpCard.dark{background:oklch(21% .02 262)}
@keyframes fpIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.fp-top{display:flex;align-items:baseline;gap:7px}
.fp-num{font-size:22px;font-weight:600;line-height:1;letter-spacing:-.01em}
.fp-unit{font-size:12px;color:var(--muted-foreground,#6A7079)}
.fp-mini{display:flex;align-items:flex-end;gap:3px;height:22px;margin-left:auto}
.fp-mini i{
  display:block;width:5px;border-radius:2px;
  background:var(--brand-soft, rgba(91,87,216,.18));
  transform-origin:bottom;
  animation:fpGrow .5s cubic-bezier(.22,1,.36,1) both;
  animation-delay:calc(var(--i) * 55ms);
}
.fp-mini i.now{background:var(--brand,#5B57D8)}
@keyframes fpGrow{from{transform:scaleY(.08);opacity:.25}to{transform:scaleY(1);opacity:1}}

.fp-line{display:flex;align-items:center;gap:10px;margin-top:11px}
.fp-step{flex:1;min-width:0;font-size:13px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-step.dim{color:var(--muted-foreground,#6A7079)}
.fp-ok{
  flex:none;padding:6px 13px;border-radius:10px;
  border:1px solid var(--brand,#5B57D8);
  background:transparent;color:var(--brand,#5B57D8);
  font-size:12px;cursor:pointer;font-family:inherit;
  transition:transform .18s cubic-bezier(.22,1,.36,1), opacity .18s ease;
}
.fp-ok:hover{transform:scale(1.05)}
.fp-ok:active{transform:scale(.95)}
.fp-ok.done{
  border-color:transparent;background:var(--brand-soft,rgba(91,87,216,.12));
  color:var(--muted-foreground,#6A7079);cursor:default;transform:none;
}
.fp-in{
  flex:1;min-width:0;padding:6px 10px;border-radius:10px;
  border:1px solid var(--border-strong,rgba(38,40,43,.16));
  background:transparent;color:var(--foreground,#1a1c1f);
  font-size:13px;outline:none;font-family:inherit;
}
.fp-in:focus{border-color:var(--brand,#5B57D8)}

.fp-back{
  font-size:13px;line-height:1.65;margin-bottom:11px;padding-bottom:11px;
  border-bottom:1px solid var(--border,rgba(38,40,43,.09));
  animation:fpIn .45s cubic-bezier(.22,1,.36,1) both;
}
.fp-back b{font-weight:600}
</style>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 【可改文字】界面上所有话都在这
   * ============================================================ */
  var TXT = {
    unit: '条资料',
    since: '攒了 {d} 天',
    sinceToday: '还没有资料',
    stepEmpty: '今天还没定',
    stepPh: '2 分钟能做完的小事',
    stepSet: '定一个',
    stepSave: '好',
    ok: '做完了',
    okDone: '已做完',
    backTitle: '你回来了',
    backBody: '中间断了没关系，你记的东西一条都没丢。'
  };

  var LS_VISIT = 'fp.visit.v1';
  var LS_STEP = 'fp.step.v1';
  var LS_HIDE = 'fp.hideback.v1';

  function ls(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function dayStart() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function days(n) { return Math.max(0, Math.round(n / 86400000)); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  /* ---------- 读静海 AI 自己的资料库（只读） ---------- */
  function loadItems(cb) {
    try {
      var req = indexedDB.open('ai-personal-vault', 2);
      req.onsuccess = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('items')) return cb([]);
        var g = db.transaction('items', 'readonly').objectStore('items').getAll();
        g.onsuccess = function () { cb(g.result || []); };
        g.onerror = function () { cb([]); };
      };
      req.onerror = function () { cb([]); };
    } catch (e) { cb([]); }
  }
  function tsOf(it) {
    var v = it.createdAt || it.created || it.time || it.date || it.updatedAt || it.updated || 0;
    if (typeof v === 'string') { var p = Date.parse(v); return isNaN(p) ? 0 : p; }
    return typeof v === 'number' ? v : 0;
  }
  function weekly(items) {
    var now = Date.now(), out = [];
    for (var w = 5; w >= 0; w--) {
      var end = now - w * 7 * 86400000, start = end - 7 * 86400000, c = 0;
      items.forEach(function (it) { var t = tsOf(it); if (t >= start && t < end) c++; });
      out.push(c);
    }
    return out;
  }
  function tonightStep() {
    var log = ls('fs.log.v1', []);
    for (var i = log.length - 1; i >= 0; i--) {
      var r = log[i];
      if (r && r.picked && r.createdAt < dayStart() + 6 * 3600000 && r.createdAt > Date.now() - 36 * 3600000) return r;
    }
    return null;
  }

  /* ---------- 数字滚动 ---------- */
  function countUp(el, to) {
    var t0 = performance.now(), dur = 700;
    (function step(now) {
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* ============================================================
   * 渲染
   * ============================================================ */
  function html(items, showBack) {
    var n = items.length;
    var times = items.map(tsOf).filter(function (t) { return t > 0; });
    var earliest = times.length ? Math.min.apply(null, times) : 0;
    var wk = weekly(items);
    var mx = Math.max.apply(null, wk.concat([1]));

    var bars = wk.map(function (c, i) {
      var h = Math.max(4, Math.round(c / mx * 22));
      return '<i class="' + (i === wk.length - 1 ? 'now' : '') + '" style="height:' + h + 'px;--i:' + i + '"></i>';
    }).join('');

    var step = tonightStep();
    var myStep = ls(LS_STEP, null);
    var showStep = step ? step.picked : (myStep && myStep.k === todayKey() ? myStep.t : '');
    var stepDone = !!(myStep && myStep.k === todayKey() && myStep.done);

    var h = '';
    if (showBack) {
      h += '<div class="fp-back"><b>' + esc(TXT.backTitle) + '</b> ' + esc(TXT.backBody) + '</div>';
    }

    h += '<div class="fp-top">'
      + '<span class="fp-num" id="fpNum">0</span>'
      + '<span class="fp-unit">' + (n ? esc(TXT.unit) + ' · ' + esc(TXT.since.replace('{d}', days(Date.now() - earliest))) : esc(TXT.sinceToday))
      + '</span>'
      + '<span class="fp-mini">' + bars + '</span>'
      + '</div>';

    h += '<div class="fp-line">';
    if (showStep) {
      h += '<span class="fp-step">' + esc(showStep) + '</span>'
        + '<button class="fp-ok' + (stepDone ? ' done' : '') + '" id="fpOk">'
        + (stepDone ? esc(TXT.okDone) : esc(TXT.ok)) + '</button>';
    } else if (editing) {
      h += '<input class="fp-in" id="fpIn" placeholder="' + esc(TXT.stepPh) + '" maxlength="40">'
        + '<button class="fp-ok" id="fpSave">' + esc(TXT.stepSave) + '</button>';
    } else {
      h += '<span class="fp-step dim">' + esc(TXT.stepEmpty) + '</span>'
        + '<button class="fp-ok" id="fpSet">' + esc(TXT.stepSet) + '</button>';
    }
    h += '</div>';

    return { html: h, n: n };
  }

  /* ============================================================
   * 插入首页并保活
   * ============================================================ */
  var card = null, editing = false, showBack = null, lastVisitWritten = false;

  function container() {
    return document.querySelector('#root div.flex.min-w-0.flex-1.flex-col');
  }

  function onHome() {
    var nav = document.querySelector('nav');
    if (nav) {
      var btns = nav.querySelectorAll('button');
      if (btns.length) {
        var f = btns[0];
        if (((f.className || '') + '').indexOf('text-brand') >= 0) return true;
        if (f.getAttribute('aria-current') === 'page') return true;
      }
    }
    var t = document.body.innerText || '';
    return !!document.querySelector('input[placeholder*="搜索"]') && t.indexOf('最近资料') >= 0;
  }

  function mount() {
    var box = container();
    if (!box) return false;
    if (!card) { card = document.createElement('div'); card.id = 'fpCard'; }
    if (card.parentElement !== box || box.firstElementChild !== card) {
      box.insertBefore(card, box.firstChild);
    }
    card.style.display = onHome() ? '' : 'none';
    return true;
  }

  function refresh() {
    if (!mount()) return;
    loadItems(function (items) {
      if (!card) return;
      if (showBack === null) {
        var lv = ls(LS_VISIT, 0);
        showBack = !!(lv && days(Date.now() - lv) >= 3 && !ls(LS_HIDE, 0) && items.length > 0);
      }
      /* 跟着静海 AI 的深浅色走 */
      card.classList.toggle('dark', document.documentElement.classList.contains('dark'));

      var r = html(items, showBack);
      card.innerHTML = r.html;
      var num = document.getElementById('fpNum');
      if (num) countUp(num, r.n);

      var ok = document.getElementById('fpOk');
      if (ok) ok.onclick = function () {
        var cur = ls(LS_STEP, null);
        var t = (cur && cur.k === todayKey()) ? cur.t : (tonightStep() ? tonightStep().picked : '');
        ok.style.transform = 'scale(.9)';
        setTimeout(function () {
          save(LS_STEP, { k: todayKey(), t: t, done: 1 });
          refresh();
        }, 130);
      };
      var set = document.getElementById('fpSet');
      if (set) set.onclick = function () { editing = true; refresh(); };
      var sv = document.getElementById('fpSave');
      if (sv) sv.onclick = function () {
        var el = document.getElementById('fpIn');
        var v = el ? (el.value || '').trim() : '';
        if (v) save(LS_STEP, { k: todayKey(), t: v.slice(0, 40), done: 0 });
        editing = false; refresh();
      };
      var inp = document.getElementById('fpIn');
      if (inp) {
        inp.onkeydown = function (e) { if (e.key === 'Enter' && sv) sv.click(); };
        setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);
      }
      if (!lastVisitWritten) { save(LS_VISIT, Date.now()); lastVisitWritten = true; }
    });
  }

  var tries = 0;
  var t1 = setInterval(function () { refresh(); if (++tries > 30) clearInterval(t1); }, 700);
  try {
    var lastRun = 0;
    var mo = new MutationObserver(function () {
      var t = Date.now();
      if (t - lastRun < 200) return;
      lastRun = t;
      mount();
    });
    mo.observe(document.body, { childList: true, subtree: true });
    try {
      var themeMo = new MutationObserver(function () { refresh(); });
      themeMo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    } catch (e) {}
  } catch (e) {}
  window.addEventListener('resize', function () { mount(); });
})();
</script>

</body>
</html>
